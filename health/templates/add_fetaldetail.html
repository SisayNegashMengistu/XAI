{% extends 'index.html' %}
{% load static %}
{% block body %}
<center>
    <section class="logins py-5">
        <div class="container py-xl-5 py-lg-3">
            <div class="title-section mb-md-5 mb-4">
                <h6 class="w3ls-title-sub"></h6>
                <br><br>
                <h5 class="w3ls-title text-uppercase text-dark font-weight-bold">Add Fetal's Detail</h5>
            </div>
            <hr/>
            <div class="login px-sm-12" style="width:100%">
                <form action="{% url 'add_fetaldetail' %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="form-group row">
                        <div class="col-md-2">
                            <label>Prolongued </label>
                            <input type="text" class="form-control" name="Prolongued" required>
                        </div>
                        <div class="col-md-2">
                            <label>Percentage of time</label>
                            <input type="text" class="form-control" name="Percentage" required>
                        </div>
                        <div class="col-md-2">
                            <label>Accelerations</label>
                            <input type="text" class="form-control" name="Accelerations" required>
                        </div>
                        <div class="col-md-2">
                            <label>Abnormal-short </label>
                            <input type="text" class="form-control" name="Abnormal" required>
                        </div>
                        <div class="col-md-2">
                            <label>Severe decelerations</label>
                            <input type="text" class="form-control" name="Severe" required>
                        </div>
                        <div class="col-md-2">
                            <label>Histo-variance</label>
                            <input type="text" class="form-control" name="Histogram_variance" required>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-2">
                            <label>Light decelerations</label>
                            <input type="text" class="form-control" name="light_decelerations" required>
                        </div>
                        <div class="col-md-2">
                            <label>Histo-min</label>
                            <input type="text" class="form-control" name="Histogram_min" required>
                        </div>
                        <div class="col-md-2">
                            <label>Uterine</label>
                            <input type="text" class="form-control" name="Uterine_contractions" required>
                        </div>
                        <div class="col-md-2">
                            <label>Mean value of</label>
                            <input type="text" class="form-control" name="mean_value" required>
                        </div>
                        <div class="col-md-2">
                            <label>Histo-mean</label>
                            <input type="text" class="form-control" name="Histogram_mean" required>
                        </div>
                        <div class="col-md-2">
                            <label>Baseline value</label>
                            <input type="text" class="form-control" name="Baseline_value" required>
                        </div>
                    </div>
                    <div class="form-group row">
                        <div class="col-md-2">
                            <label for="explanation_type"> Explanation Type</label>
                            <select id="explanation_type" name="explanation_type" class="form-control" required>
                                <option value="" disabled selected>Select explanation type</option>
                                <option value="lime">LIME</option>
                                <option value="shap">SHAP</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn submit mt-4" style="background-color: #04aed8;">Detect->Predict</button>
                </form>
            </div>
        </div>
    </section>
</center>
{% endblock %}
